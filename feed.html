<style>

:root{--bg:#0c0e14;--card:#12141c;--card2:#181a24;--border:#222738;--text:#e0e2ec;--muted:#8b93a8;--gold:#e8b86d;--teal:#4ec9b0;}
body.light{--bg:#ddd8cf;--card:#f0ece3;--card2:#e5e0d7;--border:#aaa49a;--gold:#7a3e00;--teal:#155c58;--muted:#54576a;--text:#15172a;--text2:#373b58;}
body.light header{background:linear-gradient(160deg,#d6d1c8 0%,#dedad1 70%);}
body.light .side-nav{background:rgba(220,215,208,0.97);}
body.light .side-nav a:hover,body.light .side-nav button:hover{background:rgba(0,0,0,.08);}
body.light .heatmap-tooltip,body.light .map-status{background:rgba(220,215,208,0.97);}
body.light .card{box-shadow:0 2px 8px rgba(0,0,0,.10);}
body.light a{color:var(--teal);}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}

.page{display:flex;flex-direction:column;height:100vh;}

@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{background:linear-gradient(90deg,var(--card2) 25%,rgba(255,255,255,.05) 50%,var(--card2) 75%);background-size:800px 100%;animation:shimmer 1.4s infinite linear;border-radius:4px;}
.skel-row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
.skel-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;}
.skel-lines{flex:1;display:flex;flex-direction:column;gap:6px;padding-top:4px;}
.skel-line{height:10px;width:70%;}
.skel-line.short{width:40%;}
#loadSkel{display:none;}
#loadSkel.visible{display:block;}



/* ── Top bar ── */

.topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;z-index:200;flex-wrap:wrap;min-height:48px;position:relative;}

.topbar h1{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;background:linear-gradient(130deg,#f5d48a,#e8b86d 50%,#b97c30);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:.05em 0 .12em;display:inline-block;white-space:nowrap;}

.back-link{color:var(--gold);text-decoration:none;font-size:.72rem;font-weight:600;opacity:.8;white-space:nowrap;}

.back-link:hover{opacity:1;}

.topnav{display:flex;align-items:center;gap:20px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;z-index:200;}
.topnav-logo{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--gold);text-decoration:none;margin-right:4px;white-space:nowrap;}
.topnav-logo:hover{opacity:.85;}
.topnav a{font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);text-decoration:none;transition:color .2s;}
.topnav a:hover{color:var(--gold);}
.topnav-current{font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.14em;color:var(--text);}
.gs-btn{font-family:'DM Mono',monospace;font-size:.60rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .2s;white-space:nowrap;}
.gs-btn:hover{border-color:var(--gold);color:var(--gold);}
.gs-btn kbd{font-family:'DM Mono',monospace;font-size:.52rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:1px 5px;letter-spacing:0;}
@media(max-width:520px){.gs-btn kbd{display:none;}}
.gs-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10000;backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding-top:16vh;}.gs-overlay.open{display:flex;}
.gs-modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:min(560px,92vw);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.7);}
.gs-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 18px;}
.gs-icon{font-size:1rem;color:var(--muted);}
.gs-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;}
.gs-input::placeholder{color:var(--muted);}
.gs-esc-hint{font-family:'DM Mono',monospace;font-size:.52rem;color:var(--muted);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:2px 6px;cursor:pointer;flex-shrink:0;}

.tb-nav{display:flex;align-items:center;gap:6px;}

.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

.srch{background:var(--card2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;color:var(--text);font-size:.73rem;outline:none;width:165px;}

.srch:focus{border-color:var(--gold);}

.badge{font-size:.63rem;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap;}
.page-insight{padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--muted);font-style:italic;border-bottom:1px solid var(--border);background:var(--card);line-height:1.5;flex-shrink:0;}



/* Nav buttons */

.nav-btn{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--muted);padding:4px 9px;cursor:pointer;font-size:.70rem;transition:all .12s;white-space:nowrap;font-family:'DM Sans',sans-serif;}

.nav-btn:hover{border-color:var(--gold);color:var(--gold);}



/* ── Calendar picker ── */

.cal-wrap{position:relative;}

.cal-btn{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--muted);padding:4px 10px;cursor:pointer;font-size:.70rem;font-family:'DM Sans',sans-serif;transition:all .12s;}

.cal-btn:hover{border-color:var(--gold);color:var(--gold);}

.cal-drop{display:none;position:fixed;top:0;left:0;z-index:9999;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:280px;box-shadow:0 4px 6px -2px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.85);}

.cal-drop.open{display:block;}

.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}

.cal-yr{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.05em;}

.cal-yrb{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 8px;transition:color .1s;}

.cal-yrb:hover{color:var(--gold);}

.cal-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.cal-mo.sel{background:rgba(78,205,196,.12);border-color:var(--teal);}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
.cal-day{background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:4px 2px;text-align:center;font-size:.52rem;font-family:'DM Mono',monospace;cursor:pointer;color:var(--text);transition:all .1s;min-width:0;}
.cal-day:hover{border-color:var(--gold);color:var(--gold);}
.cal-day.cur{background:rgba(232,184,109,.12);border-color:var(--gold);color:var(--gold);}
.cal-day .cnt{display:block;font-size:.40rem;color:var(--muted);margin-top:1px;}

.cal-mo{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:5px 3px;text-align:center;font-size:.58rem;font-family:'DM Mono',monospace;cursor:pointer;color:var(--muted);transition:all .1s;letter-spacing:.01em;}

.cal-mo.has{color:var(--text);}

.cal-mo.has:hover{border-color:rgba(232,184,109,.4);color:var(--gold);}

.cal-mo.cur{background:rgba(232,184,109,.12);border-color:var(--gold);color:var(--gold);}

.cal-mo.empty{opacity:.2;cursor:default;pointer-events:none;}

.cal-mo .cnt{display:block;font-size:.44rem;color:var(--muted);margin-top:1px;}



/* ── Layout ── */

.content{display:flex;flex:1;overflow:hidden;}



/* Feed column */

.feed-col{width:380px;flex-shrink:0;overflow:hidden;display:flex;flex-direction:column;border-right:1px solid var(--border);}

.feed-scroll{flex:1;overflow-y:auto;position:relative;scroll-behavior:auto;}

.feed-scroll::-webkit-scrollbar{width:3px;}

.feed-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px;}

.vs-sizer{position:relative;}

.vs-win{position:absolute;top:0;left:0;right:0;}



/* ── Gap indicators ── */

.gap-row{position:absolute;left:10px;right:10px;display:flex;align-items:center;gap:7px;pointer-events:none;}

.gap-line{flex:1;height:1px;}

.gap-lbl{font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;}

.gap-mode{font-size:.78rem;vertical-align:-1px;letter-spacing:0;}

.g-sm .gap-line{background:rgba(255,255,255,.055);}

.g-sm .gap-lbl{font-size:.50rem;color:rgba(255,255,255,.18);}

.g-md .gap-line{background:rgba(232,184,109,.18);}

.g-md .gap-lbl{font-size:.56rem;color:rgba(232,184,109,.55);}

.g-lg .gap-line{background:rgba(232,184,109,.45);height:2px;}

.g-lg .gap-lbl{font-size:.62rem;color:var(--gold);}



/* ── Card ── */

.fcard{

  position:absolute;left:8px;right:8px;

  background:var(--card);border:1px solid var(--border);border-radius:11px;

  overflow:hidden;cursor:pointer;

  padding:11px 14px 10px;

  display:flex;flex-direction:column;gap:3px;

  transition:border-color .12s,box-shadow .12s;

}

.fcard:hover{border-color:rgba(232,184,109,.3);}

.fcard.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,109,.12),0 2px 16px rgba(232,184,109,.08);}



/* Venue row with icon */

.fc-venue-row{display:flex;align-items:flex-start;gap:6px;justify-content:space-between;}

.fc-cat-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;}

.fc-venue{font-size:.86rem;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;min-height:2.2em;}

.fc-venue a{color:var(--text);text-decoration:none;}

.fc-venue a:hover{color:var(--gold);}



/* Category, location, weather, time */

.fc-cat{font-family:'DM Mono',monospace;font-size:.57rem;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.fc-loc{font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.fc-with{font-family:'DM Mono',monospace;font-size:.56rem;color:var(--teal);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
/* Reconstructed (pre-2012 backfill) check-ins render identically to real cards;
   only a compact "↺ reconstructed" marker sits in the top-right corner of the
   venue row (where the category icon would be). No card muting/dashing. */
.fc-refurb{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:2px 6px;font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.04em;white-space:nowrap;margin-top:1px;}
.fc-no-fsq{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.4);color:#60a5fa;border-radius:5px;padding:2px 6px;font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.04em;white-space:nowrap;margin-top:2px;}
.fc-refurb-stack{flex-shrink:0;display:inline-flex;flex-direction:column;align-items:flex-end;}

.fc-loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.fc-weather-row{font-size:.60rem;color:var(--muted);min-height:.85rem;display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:auto;}

.fc-weather-loading{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--muted);animation:pulse 1.5s infinite;}

.fc-time{font-family:'DM Mono',monospace;font-size:.60rem;color:var(--muted);white-space:nowrap;}



/* ── Map side ── */

.map-col{flex:1;position:relative;min-width:0;}

#map{position:absolute;inset:0;}

.leaflet-container{background:#0c0e14;}



/* Progress strip */

.prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.04);z-index:400;}

.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),#b97c30);transition:width .06s linear;width:0%;}



/* ── Month view status bar ── */
.month-bar{display:none;align-items:center;gap:8px;padding:5px 12px;background:rgba(78,205,196,.07);border-bottom:1px solid rgba(78,205,196,.2);font-family:'DM Mono',monospace;font-size:.62rem;color:var(--teal);flex-shrink:0;}
.month-bar.visible{display:flex;}
.month-bar-back{margin-left:auto;background:none;border:1px solid rgba(78,205,196,.3);color:var(--muted);cursor:pointer;font-size:.60rem;padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace;transition:color .1s,border-color .1s;}
.month-bar-back:hover{color:var(--teal);border-color:var(--teal);}

@media(max-width:700px){.feed-col{width:100%;border-right:none;}.map-col{display:none;}}
@media(max-width:480px){
  .topbar{padding:6px 10px;gap:5px;min-height:auto;}
  .topbar h1{font-size:1rem;}
  .srch{width:100%;order:10;margin-top:4px;}
  .tb-right{flex-wrap:wrap;gap:5px;}
  .tb-nav{flex-wrap:wrap;gap:4px;}
  .nav-btn{font-size:.64rem;padding:3px 7px;}
  .badge{display:none;}
  .cal-drop{min-width:calc(100vw - 20px);left:10px!important;top:auto!important;bottom:0;}
  .cal-mo{font-size:.62rem;}
  .tcard{padding:10px 12px 9px;}
}

</style>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// [ts, date, time, venue, city, country, cat, vid, lat, lng]

let ALL=[];

let YM_IDX={};
let META_TOTAL=0;
let FIRST_TS=null;
let FLIGHT_DAYS=[];   // sorted "YYYY-MM-DD" UTC days with an FR24 diary flight
let _loadGen=0; // generation counter — incremented on state reset to discard stale fetches



// ── Country → ISO 3166-1 alpha-2 ──

const ISO2={"Afghanistan": "af", "Albania": "al", "Algeria": "dz", "Angola": "ao", "Argentina": "ar", "Armenia": "am", "Australia": "au", "Austria": "at", "Azerbaijan": "az", "Belarus": "by", "Belgium": "be", "Bolivia": "bo", "Bosnia and Herzegovina": "ba", "Brazil": "br", "Bulgaria": "bg", "Cambodia": "kh", "Canada": "ca", "Chile": "cl", "China": "cn", "Colombia": "co", "Croatia": "hr", "Cyprus": "cy", "Czech Republic": "cz", "Denmark": "dk", "Ecuador": "ec", "Egypt": "eg", "Estonia": "ee", "Finland": "fi", "France": "fr", "Georgia": "ge", "Germany": "de", "Greece": "gr", "Hungary": "hu", "Hong Kong": "hk", "India": "in", "Indonesia": "id", "Iran": "ir", "Iraq": "iq", "Ireland": "ie", "Israel": "il", "Italy": "it", "Japan": "jp", "Kazakhstan": "kz", "Kosovo": "xk", "Kyrgyzstan": "kg", "Latvia": "lv", "Lithuania": "lt", "Luxembourg": "lu", "Macao": "mo", "Malaysia": "my", "Malta": "mt", "Mexico": "mx", "Moldova": "md", "Montenegro": "me", "Morocco": "ma", "Myanmar": "mm", "Netherlands": "nl", "New Zealand": "nz", "North Macedonia": "mk", "Norway": "no", "Oman": "om", "Pakistan": "pk", "Peru": "pe", "Philippines": "ph", "Poland": "pl", "Portugal": "pt", "Qatar": "qa", "Romania": "ro", "Russia": "ru", "Serbia": "rs", "Singapore": "sg", "Slovakia": "sk", "Slovenia": "si", "South Korea": "kr", "Spain": "es", "Sweden": "se", "Switzerland": "ch", "Taiwan": "tw", "Thailand": "th", "Tunisia": "tn", "Turkey": "tr", "Türkiye": "tr", "Ukraine": "ua", "United Arab Emirates": "ae", "United Kingdom": "gb", "United States": "us", "Uruguay": "uy", "Uzbekistan": "uz", "Tajikistan": "tj", "Venezuela": "ve", "Vietnam": "vn", "Holy See (Vatican City State)": "va", "Vatican City": "va", "North Korea": "kp", "Cuba": "cu", "Iceland": "is", "Sri Lanka": "lk", "Liechtenstein": "li", "San Marino": "sm", "Andorra": "ad", "Monaco": "mc", "Turkmenistan": "tm", "Czechia": "cz", "Mongolia": "mn", "Nepal": "np", "UAE": "ae", "Saudi Arabia": "sa", "Jordan": "jo", "Lebanon": "lb", "South Africa": "za", "Bangladesh": "bd", "Macau": "mo"};

function flagHtml(country){

  const code=ISO2[(country||'').trim()];

  if(!code) return '';

  return `<span class="fi fi-${code}" style="font-size:1em;border-radius:2px;vertical-align:middle;flex-shrink:0"></span>`;

}

function wmoByTime(code,hour){

  const[em,desc]=WMO[code]||['',''];

  if(!em) return['',desc];

  if(code===0||code===1){

    if(hour<6||hour>=22) return['🌙',desc];

    if(hour<9) return[code===0?'🌅':'🌤️',desc];

    if(hour>=18) return[code===0?'🌇':'🌤️',desc];

  }

  return[em,desc];

}

// Weather cache — hourly arrays keyed by lat,lng,date (matches index.html)

const wCache={};

async function fetchWeather(lat,lng,ts){

  if(!lat||!lng) return null;

  const d=new Date(ts*1000).toISOString().slice(0,10);

  const k=`${lat.toFixed(1)},${lng.toFixed(1)},${d}`;

  if(k in wCache) return wCache[k];

  wCache[k]=null;

  try{

    const j=await(await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&start_date=${d}&end_date=${d}&hourly=temperature_2m,weather_code&timezone=auto`)).json();

    wCache[k]={temps:j.hourly?.temperature_2m||[],codes:j.hourly?.weather_code||[]};

  }catch(e){}

  return wCache[k];

}

const CARD_H=138;

const GAP_PAD=8;

const ITEM_STEP=CARD_H+6;

const G={sm:14,md:22,lg:32};



function havNum(lat1,lng1,lat2,lng2){

  if(!lat1||!lng1||!lat2||!lng2) return null;

  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;

  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;

  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

}

function haversine(lat1,lng1,lat2,lng2){

  const d=havNum(lat1,lng1,lat2,lng2);

  if(d==null) return null;

  return d<1?`${Math.round(d*1000)}m`:d<10?`${d.toFixed(1)}km`:`${Math.round(d)}km`;

}

// ── Transport-mode icon between consecutive check-ins ──
// Client-side mirror of the rule core in scripts/transport_mode.py:
// FR24 flight days → category anchors (exact names, sanity-checked) → speed/
// distance bands.  v = d/Δt is a LOWER bound (Δt includes dwell time).
const M_VEH={'Plane':'P','Train':'T','Bus Line':'U','Boat or Ferry':'F'};
const M_STA={'Airport':'P','International Airport':'P','Airport Terminal':'P','Airport Gate':'P','Airport Lounge':'P',
  'Rail Station':'T','Train Station':'T','Metro Station':'T','Tram Station':'T','Light Rail Station':'T','Platform':'T',
  'Airport Tram Station':'T','Monorail':'T','Bus Station':'U','Bus Stop':'U','Bus Terminal':'U',
  'Ferry Terminal':'F','Pier':'F','Harbor or Marina':'F','Port':'F'};
const M_SANE={W:[10,20],B:[32,120],C:[160,900],T:[280,1500],U:[130,1200],F:[80,600]}; // [vmax,dmax]
const M_ICON={W:'🚶',B:'🚴',C:'🚗',T:'🚆',U:'🚌',F:'⛴️',P:'✈️'};

function saneM(m,d,v){
  if(m==='P') return d>=100;
  const s=M_SANE[m];
  return !s||(v<=s[0]&&d<=s[1]);
}

function flightBetween(t0,t1){ // any FR24 flight day in [t0,t1] ± 3h slack
  if(!FLIGHT_DAYS.length) return false;
  const d0=new Date((t0-10800)*1000).toISOString().slice(0,10);
  const d1=new Date((t1+10800)*1000).toISOString().slice(0,10);
  let lo=0,hi=FLIGHT_DAYS.length-1,f=-1;
  while(lo<=hi){const m=(lo+hi)>>1;FLIGHT_DAYS[m]>=d0?(f=m,hi=m-1):lo=m+1;}
  return f>=0&&FLIGHT_DAYS[f]<=d1;
}

function moveMode(o,n){ // o = older tuple, n = newer tuple → mode char or ''
  const d=havNum(o[8],o[9],n[8],n[9]);
  if(d==null||d<0.05) return '';
  const dtH=Math.max((n[0]-o[0])/3600,1/60), v=d/dtH;
  if(d>=100&&flightBetween(o[0],n[0])) return 'P';
  for(const map of [M_VEH,M_STA])
    for(const c of [o[6],n[6]]){
      const m=map[c];
      if(m&&saneM(m,d,v)) return m;
    }
  if(dtH>18) return '';                 // too long a gap to guess
  if(v>=150||d>=500) return 'P';
  if(v>=25||v>=7) return 'C';
  return d<8?'W':'C';
}

function gapFor(sec){

  const h=sec/3600;

  if(h<0.5) return null;

  if(h<8)  return{g:'sm',h:G.sm,t:h<2?`${Math.round(h*60)}m later`:`${Math.round(h)}h later`};

  if(h<36) return{g:'md',h:G.md,t:`${Math.round(h)}h later`};

  return{g:'lg',h:G.lg,t:`${Math.round(h/24)}d later`};

}



let DATA=ALL, pos=[], totalH=0; let isFiltered=false; let monthMode=null;
let fwdCursor=null, fwdCursorId=null, revCursor=null, revCursorId=null, fwdDone=false, revDone=false, gapLoading=false;
const GAP_NEAR=80;

const AVG_ITEM_H=ITEM_STEP+6; // ~132px average, used for unloaded region estimation

function buildPos(data){
  pos=new Array(data.length);
  let y=GAP_PAD;
  for(let i=0;i<data.length;i++){
    if(i>0){const gp=gapFor(data[i-1][0]-data[i][0]);if(gp)y+=gp.h;}
    pos[i]=y; y+=ITEM_STEP;
  }
  const loadedH=data.length?y+GAP_PAD:0;
  if(isFiltered||monthMode){
    totalH=loadedH;
  } else if(fwdDone){
    totalH=loadedH; // exact — no more items
  } else {
    const remaining=Math.max(0,META_TOTAL-ALL.length);
    const estimated=loadedH+remaining*AVG_ITEM_H;
    totalH=Math.max(totalH,estimated); // never shrink during incremental loads
  }
}

function getIndexFromScrollTop(scrollTop){
  if(!DATA.length) return 0;
  let lo=0,hi=DATA.length-1,best=0;
  while(lo<=hi){const m=(lo+hi)>>1;pos[m]<=scrollTop?(best=m,lo=m+1):hi=m-1;}
  return best;
}



const OVER=5;

let lastR=[-1,-1];

function renderVis(){

  const sc=document.getElementById('feedScroll');

  const st=sc.scrollTop, sh=sc.clientHeight;

  let lo=0,hi=DATA.length-1,s0=0;

  while(lo<=hi){const m=(lo+hi)>>1;pos[m]+ITEM_STEP<st?lo=m+1:(hi=m-1,s0=m);}

  const start=Math.max(0,s0-OVER);

  let end=start; while(end<DATA.length&&pos[end]<st+sh)end++; end=Math.min(DATA.length-1,end+OVER);

  if(start===lastR[0]&&end===lastR[1]) return;

  lastR=[start,end];

  let html='';

  for(let i=start;i<=end;i++){

    if(i>0){

      const gp=gapFor(DATA[i-1][0]-DATA[i][0]);

      if(gp){

        const ci0=DATA[i-1],ci1=DATA[i];

        const dist=(ci0&&ci1)?haversine(ci0[8],ci0[9],ci1[8],ci1[9]):null;

        const distStr=dist?` · ↔ ${dist}`:'';

        const mi=(ci0&&ci1)?M_ICON[moveMode(ci1,ci0)]||'':'';

        const miStr=mi?`<span class="gap-mode">${mi}</span> `:'';

        html+=`<div class="gap-row g-${gp.g}" style="top:${pos[i]-gp.h+1}px;height:${gp.h-2}px;"><div class="gap-line"></div><span class="gap-lbl">${miStr}${gp.t}${distStr}</span><div class="gap-line"></div></div>`;

      }

    }

    html+=mkCard(i);

  }

  document.getElementById('vsWin').innerHTML=html;

  for(let i=start;i<=end;i++) injectW(i);

}

function fillW(i,w){

  const hour=DATA[i]?parseInt((DATA[i][2]||'12:00').split(':')[0]):12;

  if(ic||tStr) wrow.innerHTML=`<span>${ic}</span><span>${tStr}</span>${desc?`<span style="opacity:.7">${desc}</span>`:''}`;

  else wrow.innerHTML='';

function injectW(i){

  const ci=DATA[i]; if(!ci) return;

  const [ts,,,,,,cat,vid,lat,lng]=ci;

  if(!lat||!lng){const el=document.getElementById(`wrow${i}`);if(el)el.innerHTML='';return;}

  const d=new Date(ts*1000).toISOString().slice(0,10);

  const k=`${lat.toFixed(1)},${lng.toFixed(1)},${d}`;

  if(k in wCache&&wCache[k]!==null){fillW(i,wCache[k]);}

  else if(!(k in wCache)&&!wPend.has(k)){

}

function _gapCheckAt(sc){

    const sc=document.getElementById('feedScroll');

    scrollRaf=requestAnimationFrame(()=>{_gapCheckAt(sc);scrollRaf=null;});

    clearTimeout(scrollEndTmr);

},{passive:true});



// ── Calendar ──

let calYr=new Date().getFullYear();

const MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const ymCnts={};
const ydCnts={};   // "YYYY-MM-DD" → count
const YD_IDX={};   // "YYYY-MM-DD" → first checkin index

function addToCalCounts(items){

  // r[1] is local date string like "03 Mar 2025" — use it for calendar so counts match displayed dates
  // YD_IDX stores the Unix timestamp r[0] so it remains valid after array splices

  items.forEach((r)=>{

    const parts=(r[1]||'').split(' ');

    if(parts.length===3){

      const mo=MOS.indexOf(parts[1])+1;

      if(mo>0){
        const ym=`${parts[2]}-${String(mo).padStart(2,'0')}`;
        ymCnts[ym]=(ymCnts[ym]||0)+1;
        const ymd=`${ym}-${parts[0]}`;
        ydCnts[ymd]=(ydCnts[ymd]||0)+1;
        if(!(ymd in YD_IDX)) YD_IDX[ymd]=r[0]; // store timestamp, not array index
      }

    }

  });

}

let selYM=null;



function toggleCal(e){

  e.stopPropagation();

  const drop=document.getElementById('calDrop');

  if(!drop.classList.contains('open')){

    const r=e.currentTarget.getBoundingClientRect();

    const feed=document.querySelector('.feed-col');

    const feedRight=feed?feed.getBoundingClientRect().right:0;

    const dropW=280;

    let left=r.left;

    if(left<feedRight) left=feedRight+4;

    if(left+dropW>window.innerWidth) left=window.innerWidth-dropW-8;

    drop.style.top=(r.bottom+6)+'px';

    drop.style.left=left+'px';

  }

  drop.classList.toggle('open');

}

document.getElementById('calDrop').addEventListener('click',e=>e.stopPropagation());

document.addEventListener('click',()=>document.getElementById('calDrop').classList.remove('open'));

function calPY(){calYr--;renderCal();}

function calNY(){calYr++;renderCal();}

function renderCal(){

  document.getElementById('calYrLbl').textContent=calYr;

  const curYM=DATA[activeIdx]?new Date(DATA[activeIdx][0]*1000).toISOString().slice(0,7):'';

  document.getElementById('calGrid').innerHTML=MOS.map((m,i)=>{

    const ym=`${calYr}-${String(i+1).padStart(2,'0')}`;

    const has=ym in YM_IDX;

    const cur=ym===curYM.slice(0,7);

    const sel=ym===selYM;

    const n=has?YM_IDX[ym]:0;

    const cnt=n>=1000?Math.round(n/100)/10+'k':n||'';

    return `<div class="cal-mo${has?' has':''}${cur?' cur':''}${sel?' sel':''}" onclick="${has?`goYM('${ym}')`:''}">${m}<span class="cnt">${cnt||''}</span></div>`;

  }).join('');

  if(selYM) renderDays(selYM); else document.getElementById('calDays').innerHTML='';

}

// Promise cache: ym → Promise so concurrent callers await the same in-flight fetch
// (using a Set would return immediately on the second call before data is ready)
const _ymDaysFetching=new Map();

async function _fetchDayCounts(ym){
  if(_ymDaysFetching.has(ym)) return _ymDaysFetching.get(ym);
  const p=(async()=>{
    try{
      const data=await(await fetch(`/api/feed?_v=refurb&month=${ym}`)).json();
      const items=data.items||[];
      const[myr,mmo]=ym.split('-').map(Number);
      const mdays=new Date(myr,mmo,0).getDate();
      // Clear stale estimates for this month, then repopulate
      for(let d=1;d<=mdays;d++) delete ydCnts[`${ym}-${String(d).padStart(2,'0')}`];
      // The API returns ±1 day of padding for timezone boundary coverage.
      // Filter to items that locally belong to the requested month to avoid
      // double-counting the same boundary check-in from adjacent month calls.
      items.forEach(r=>{
        const ymd=rowToYmd(r);
        if(!ymd||ymd.slice(0,7)!==ym) return; // locally belongs to adjacent month
        ydCnts[ymd]=(ydCnts[ymd]||0)+1;
        if(!(ymd in YD_IDX)) YD_IDX[ymd]=r[0];
      });
      // Refresh day grid if this month is still expanded
      if(selYM===ym) renderDays(ym);
    }catch(e){_ymDaysFetching.delete(ym);}// allow retry on error
  })();
  _ymDaysFetching.set(ym,p);
  return p;
}

function goYM(ym){
  // Only expand the day grid — don't fetch; user must click a specific day
  if(selYM===ym){selYM=null;document.getElementById('calDays').innerHTML='';renderCal();return;}
  selYM=ym;
  renderCal();
  // Fetch day counts in background if not yet loaded
  _fetchDayCounts(ym);
}

function renderDays(ym){
  const[yr,mo]=ym.split('-').map(Number);
  const days=new Date(yr,mo,0).getDate();
  const curYMD=DATA[activeIdx]?`${DATA[activeIdx][1].split(' ')[2]}-${String(MOS.indexOf(DATA[activeIdx][1].split(' ')[1])+1).padStart(2,'0')}-${DATA[activeIdx][1].split(' ')[0]}`:'';
  let html='';
  for(let d=1;d<=days;d++){
    const ymd=`${ym}-${String(d).padStart(2,'0')}`;
    const cnt=ydCnts[ymd]||0;
    if(!cnt){html+=`<div class="cal-day" style="opacity:.18">${d}</div>`;continue;}
    const cur=ymd===curYMD;
    html+=`<div class="cal-day${cur?' cur':''}" onclick="goYMD('${ymd}')">${d}<span class="cnt">${cnt}</span></div>`;
  }
  document.getElementById('calDays').innerHTML=html;
}

// Binary search on DESC-sorted ALL for a specific timestamp → array index
function tsToIdx(ts){
  let lo=0,hi=ALL.length-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(ALL[m][0]===ts)return m;if(ALL[m][0]>ts)lo=m+1;else hi=m-1;}
  return -1;
}

// Shared helper: convert a rendered date string "DD Mon YYYY" → "YYYY-MM-DD"
function rowToYmd(r){
  const parts=(r[1]||'').split(' ');
  if(parts.length!==3) return '';
  const mo=MOS.indexOf(parts[1])+1;
  if(!mo) return '';
  return `${parts[2]}-${String(mo).padStart(2,'0')}-${parts[0]}`;
}

async function goYMD(ymd){
  document.getElementById('calDrop').classList.remove('open');
  selYM=null;
  const ym=ymd.slice(0,7);
  await _fetchDayCounts(ym);
  if(!ydCnts[ymd]) return;
  if(monthMode) exitMonthView();
  // Fast path: target day already loaded in ALL
  for(let i=0;i<ALL.length;i++){if(rowToYmd(ALL[i])===ymd){_jumpToTop(i);return;}}
  // Not loaded — fetch from API and reset state
  const ts=YD_IDX[ymd];
  if(ts==null) return;
  try{
    const d=await(await fetch(`/api/feed?_v=refurb&cursor=${ts+1}&limit=50`)).json();
    const items=d.items||[];
    if(!items.length) return;
    _loadGen++;
    ALL=items;
    fwdCursor=d.has_more?d.next_cursor:null;
    fwdCursorId=d.has_more?d.next_cursor_id:null;
    fwdDone=!d.has_more;
    revCursor=items[0][0]; revCursorId=items[0][10];
    revDone=false;
    isFiltered=false;
    document.getElementById('srch').value='';
    DATA=ALL;
    addToCalCounts(items);
    totalH=0; buildPos(DATA);
    document.getElementById('vsSizer').style.height=totalH+'px';
    document.getElementById('badge').textContent=(META_TOTAL||ALL.length).toLocaleString()+' check-ins';
    lastR=[-1,-1];
    let targetIdx=0;
    for(let i=0;i<ALL.length;i++){if(rowToYmd(ALL[i])===ymd){targetIdx=i;break;}}
    _jumpToTop(targetIdx);
  }catch(e){console.warn('goYMD',e);}
}

function _jumpToTop(i){
  i=Math.max(0,Math.min(DATA.length-1,Math.round(i)));
  manualClick=true;
  clearTimeout(manualTimer);
  manualTimer=setTimeout(()=>{manualClick=false;},1500);
  activate(i,false);
  const sc=document.getElementById('feedScroll');
  sc.scrollTop=Math.max(0,(pos[i]||0)-40);
  lastR=[-1,-1];
  setTimeout(()=>{renderVis();checkGapLoad();},60);
}

async function fetchAndShowMonth(ym){
  document.getElementById('calDrop').classList.remove('open');
  document.getElementById('badge').textContent='Loading…';

  let rawItems=[];
  try{
    const res=await fetch(`/api/feed?_v=refurb&month=${ym}`);
    const data=await res.json();
    rawItems=data.items||[];
  }catch(e){}

  // The API pads ±1 day for timezone boundary coverage; filter to rows
  // whose locally rendered date actually belongs to the requested month.
  const items=rawItems.filter(r=>rowToYmd(r).slice(0,7)===ym);

  // Update ydCnts for this month from filtered items (ensures day grid is accurate)
  const[myr,mmo]=ym.split('-').map(Number);
  const mdays=new Date(myr,mmo,0).getDate();
  for(let d=1;d<=mdays;d++) delete ydCnts[`${ym}-${String(d).padStart(2,'0')}`];
  items.forEach(r=>{
    const ymd2=rowToYmd(r);
    if(ymd2) ydCnts[ymd2]=(ydCnts[ymd2]||0)+1;
  });

  // Enter month view
  monthMode=ym;
  DATA=items;
  selYM=ym;
  calYr=parseInt(ym.split('-')[0]);

  lastR=[-1,-1];
  buildPos(DATA);
  document.getElementById('vsSizer').style.height=totalH+'px';
  document.getElementById('feedScroll').scrollTop=0;

  if(DATA.length) activate(0,false);

  document.getElementById('monthBarLabel').textContent=label;
  document.getElementById('monthBar').classList.add('visible');
  document.getElementById('badge').textContent=items.length.toLocaleString()+' check-ins';
}

// ── Contiguous scroll loading ──

function _skelShow(v){const s=document.getElementById('loadSkel');if(s)s.classList.toggle('visible',v);}

async function loadFwd(){
  if(gapLoading||fwdDone||!fwdCursor) return;
  gapLoading=true;_skelShow(true);
  const gen=_loadGen;
  try{
    const cid=fwdCursorId?`&cursor_id=${encodeURIComponent(fwdCursorId)}`:'';
    const d=await(await fetch(`/api/feed?_v=refurb&limit=50&cursor=${fwdCursor}${cid}`)).json();
    if(gen!==_loadGen) return;
    const items=d.items||[];
    if(!items.length){fwdDone=true;return;}
    ALL.push(...items);
    addToCalCounts(items);
    fwdCursor=d.has_more?d.next_cursor:null;
    fwdCursorId=d.has_more?d.next_cursor_id:null;
    if(!fwdCursor) fwdDone=true;
    if(!isFiltered&&!monthMode){
      DATA=ALL;
      buildPos(DATA);
      document.getElementById('vsSizer').style.height=totalH+'px';
      lastR=[-1,-1];
      renderVis();
    }
  }catch(e){console.warn('loadFwd',e);}
  finally{gapLoading=false;_skelShow(false);}
}

async function loadRev(){
  if(gapLoading||revDone||revCursor==null) return;
  gapLoading=true;_skelShow(true);
  const gen=_loadGen;
  try{
    const rid=revCursorId?`&after_id=${encodeURIComponent(revCursorId)}`:'';
    const d=await(await fetch(`/api/feed?_v=refurb&after=${revCursor}${rid}&limit=50`)).json();
    if(gen!==_loadGen) return;
    const items=d.items||[];
    if(!items.length){revDone=true;return;}
    const sc=document.getElementById('feedScroll');
    const oldSt=sc.scrollTop;
    const oldFirstPos=pos[0]||GAP_PAD;
    ALL.unshift(...items);
    if(activeIdx>=0) activeIdx+=items.length;
    addToCalCounts(items);
    revCursor=items[0][0];
    revCursorId=items[0][10];
    if(!d.has_more) revDone=true;
    if(!isFiltered&&!monthMode){
      DATA=ALL;
      buildPos(DATA);
      const newFirstPos=pos[items.length]||GAP_PAD;
      const shift=newFirstPos-oldFirstPos;
      sc.scrollTop=oldSt+shift;
      document.getElementById('vsSizer').style.height=totalH+'px';
      lastR=[-1,-1];
      renderVis();
    }
  }catch(e){console.warn('loadRev',e);}
  finally{gapLoading=false;_skelShow(false);}
}

function checkGapLoad(){
  if(gapLoading||isFiltered||monthMode) return;
  if(fwdDone&&revDone) return;
  const sc=document.getElementById('feedScroll');
  const st=sc.scrollTop, sb=st+sc.clientHeight;
  const prefetch=GAP_NEAR*AVG_ITEM_H;
  if(!fwdDone&&fwdCursor&&DATA.length>0){
    const loadedBottom=pos[DATA.length-1]+ITEM_STEP;
    if(sb>=loadedBottom-prefetch){loadFwd();return;}
  }
  if(!revDone&&revCursor!=null){
    if(st<prefetch) loadRev();
  }
}

let _srchGen=0, _srchSavedSt=null;

function _applySearchResults(items, q){
  isFiltered=true;

  buildPos(DATA);
  document.getElementById('vsSizer').style.height=totalH+'px';

}

function _clearSearch(){
  isFiltered=false;
  DATA=ALL;
  lastR=[-1,-1];
  buildPos(DATA);
  document.getElementById('vsSizer').style.height=totalH+'px';
  document.getElementById('badge').textContent=(META_TOTAL||ALL.length).toLocaleString()+' check-ins';

  if(_srchSavedSt!=null){sc.scrollTop=_srchSavedSt;_srchSavedSt=null;}
  lastR=[-1,-1];
  renderVis();
}

let _srchDebounce=null;
function onSearch(q){
  const ql=q.trim();
  if(!ql){
    _srchGen++;
    clearTimeout(_srchDebounce);
    _clearSearch();
    return;
  }
  // Save scroll position the first time we enter search mode
  if(!isFiltered){
    _srchSavedSt=document.getElementById('feedScroll').scrollTop;
  }
  clearTimeout(_srchDebounce);
  _srchDebounce=setTimeout(async()=>{
    const gen=++_srchGen;
    // Optimistic local filter while D1 loads
    const lo=ql.toLowerCase();
    const local=ALL.filter(r=>(r[3]||'').toLowerCase().includes(lo)||(r[4]||'').toLowerCase().includes(lo)||
      (r[5]||'').toLowerCase().includes(lo)||(r[6]||'').toLowerCase().includes(lo));
    _applySearchResults(local, ql);
    try{
      const d=await(await fetch('/api/feed?_v=refurb&q='+encodeURIComponent(ql))).json();
      if(gen!==_srchGen) return; // stale
      _applySearchResults(d.items||[], ql);
    }catch(e){console.warn('search',e);}
  },320);
}

window.addEventListener('resize',()=>{lastR=[-1,-1];renderVis();});

(async function init(){
  const PG=100;

  try{
    const meta=await(await fetch('/feed_meta.json')).json();
    YM_IDX=meta.ym_index||{};
    META_TOTAL=meta.total||0;
    FIRST_TS=meta.first_ts||null;
    FLIGHT_DAYS=meta.flight_days||[];
    document.getElementById('badge').textContent=META_TOTAL.toLocaleString()+' check-ins';
    renderCal();
    // ── Page insight ─────────────────────────────────────────────────────────
    (function(){
      var ym = YM_IDX || {};
      var months = Object.keys(ym);
      // Months are newest-first; last entry is oldest month
      var oldestYm = months.length ? months[months.length - 1] : '';
      var oldestYr = oldestYm ? oldestYm.split('-')[0] : '';
      // Compute busiest month by diff between consecutive sorted entries
      var sorted = months.slice().sort();
      var bestMo = '', bestN = 0;
      for (var i = 1; i < sorted.length; i++) {
        var n = (ym[sorted[i]] || 0) - (ym[sorted[i-1]] || 0);
        if (n > bestN) { bestN = n; bestMo = sorted[i-1]; }
      }
      // Also check the last month's absolute offset (it IS the count for that month)
      // Actually ym values are cumulative from newest → oldest. The first month's count
      // is the raw value of the most recent month. The last entry value = total of all
      // months preceding it, so diff logic above is correct.
      var bestLabel = bestMo ? bestMo.replace('-', '\u2009') : '';
      var txt = (META_TOTAL||0).toLocaleString() + ' check-ins'
        + (oldestYr ? ', dating back to ' + oldestYr : '') + '. '
        + (bestLabel && bestN ? 'Busiest month: ' + bestLabel + ' (' + bestN.toLocaleString() + ' check-ins). ' : '')
        + 'Every scroll is a step further back in time.';
      var el = document.getElementById('page-insight');
      if (el) el.textContent = txt;
    })();
  }catch(e){console.warn('feed_meta.json error',e);}

  let newestData={items:[],has_more:false,next_cursor:null,next_cursor_id:null};
  try{
    newestData=await(await fetch(`/api/feed?_v=refurb&limit=${PG}`)).json();
  }catch(e){console.warn('init fetch',e);}

  const items=newestData.items||[];
  ALL=items;
  fwdCursor=newestData.has_more?newestData.next_cursor:null;
  fwdCursorId=newestData.has_more?newestData.next_cursor_id:null;
  fwdDone=!newestData.has_more;
  revDone=true;
  revCursor=null; revCursorId=null;

  addToCalCounts(items);
  DATA=ALL;
  buildPos(DATA);
  document.getElementById('vsSizer').style.height=totalH+'px';
  if(!Object.keys(YM_IDX).length) renderCal();
  renderVis();
  if(ALL.length) activate(0,false);

  const _q=new URLSearchParams(location.search).get('q');
  if(_q){const _inp=document.getElementById('srch');if(_inp){_inp.value=_q;onSearch(_q);}}
})();

</script>

<script>
(function(){
  var btn=document.getElementById('snThemeToggle');
  var ico=document.getElementById('snThemeIcon');
  var lbl=document.getElementById('snThemeLbl');
  function apply(light){
    document.body.classList.toggle('light',light);
    if(ico) ico.textContent=light?'\u{1F319}':'\u2600\uFE0F';
    if(lbl) lbl.textContent=light?'DARK':'LIGHT';
  }
  apply(localStorage.getItem('fsq-theme')==='light');
  if(btn) btn.addEventListener('click',function(){
    var isLight=document.body.classList.toggle('light');
    localStorage.setItem('fsq-theme',isLight?'light':'dark');
    apply(isLight);
  });
})();
</script>
