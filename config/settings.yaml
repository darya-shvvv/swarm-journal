trip_detection:
  home_city: Minsk         # default/fallback
  min_checkins: 5          # minimum check-ins outside home to count as a real trip
  
  # Time-based home city periods (inclusive start, exclusive end)
  home_periods:
    - start: ~              # beginning of time
      end: 1763136000       # 2025-11-14 00:00:00 UTC (14.11.2025)
      city: Hrodna
    - start: 1763136000     # 2025-11-14 00:00:00 UTC
      end: ~                # future
      city: Minsk
      # Arrival rule (same key as upstream home_history eras): the first sign of
      # being back in Minsk — e.g. the "Minsk (Мінск)" City check-in — ends a
      # trip and is included in it, so a day trip doesn't stop at the last stop
      # outside Minsk. Walks at most 3 Minsk check-ins.
      arrival_stop_at_home: true
      arrival_max_city_checkins: 3

dashboard:
  title: "Check-in Journal"
  subtitle_source: "Foursquare"
  foursquare_user_id: "29447180"

# CARTO basemap key (free, non-commercial: https://carto.com/basemaps/apikey).
